workspace:
  name: my-service
  language: go

signals:
  - adapter: git
    watch: [push, pr]
  - adapter: schedule
    cron: "0 0 2 * * *"   # 6-field cron with seconds: nightly at 02:00
  # - adapter: github-ci
  #   repo: myorg/my-service
  #   token: $GITHUB_TOKEN
  #   poll_interval: 60s
  #   watch: [failure]

autonomy:
  dependency_updates: auto-commit
  test_fixes: auto-commit
  bug_fixes: pull-request
  refactoring: suggest-only
  schema_changes: suggest-only
  log_fixes: suggest-only
  metric_fixes: suggest-only
  uptime_fixes: notify

verification:
  enabled: true        # deterministic commands + evaluator gate (default true)
  # commands run sequentially for changed auto-commit/pull-request tasks
  # commands:
  #   - name: tests
  #     run: go test ./...
  #     required_tools: [go]
  #     timeout: 10m
  #     working_directory: .
  #     pass_env: [PATH, HOME]

workflow:
  evaluator:
    max_turns: 20       # default 20; maximum 50
    # suggest (default), fail, or draft-change-request. The draft option is
    # available for pull-request autonomy and never represents evaluator PASS.
    on_error: suggest

observability:
  agent_traces:
    enabled: true
    capture_assistant_text: final-only # none | final-only | all-visible
    capture_tool_arguments: sanitized  # none | sanitized
    capture_tool_output: bounded       # none | metadata | bounded
    output_limit: 16384                 # bytes; maximum 65536
    retention_days: 30                  # 1–365
    log_tool_activity: true

# Provider-aware pull-request delivery. Configure this on repositories using
# pull-request autonomy; GitLab creates an MR and GitHub creates a PR.
# delivery:
#   provider: gitlab
#   repo: group/project
#   remote: origin
#   api_base_url: https://gitlab.example.gov/api/v4
#   token: $GITLAB_TOKEN
#   base_branch: main

models:
  planning: anthropic/claude-sonnet-4-6
  coding: anthropic/claude-sonnet-4-6
  triage: anthropic/claude-haiku-4-5
  evaluator: anthropic/claude-sonnet-4-6   # optional; defaults to coding model

scope:
  include: [src/, tests/]
  exclude: [secrets/]

skills:
  dir: .sidecar/skills   # SKILL.md files in the target repo; loaded into the coding agent

budget:
  # Sums provider-reported usage (input+output+cache) across all turns of each
  # run, for triage + coding + evaluator. Accurate when the provider reports
  # usage; runs against providers that don't report usage are not counted.
  daily_tokens: 0        # per-workspace per-UTC-day token cap; 0 = unlimited
